<!doctype html>
<html lang="en">
<head>

<title>Nexus Ring inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0E14; color: #E6E1D6; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="position: absolute; top: -60px; left: 50%; width: 500px; height: 500px; margin-left: -250px; border-radius: 50%; background: radial-gradient(circle, rgba(79,209,224,0.16) 0%, rgba(79,209,224,0) 58%); pointer-events: none"></div>

  <div style="padding: 56px 28px 0 28px; display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative">
    <div style="position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center">
      <div style="position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(216,180,90,0.45)"></div>
      <div style="position: absolute; inset: 14px; border-radius: 50%; border: 1px solid rgba(216,180,90,0.7)"></div>
      <div style="position: absolute; inset: 28px; border-radius: 50%; border: 1px solid #D8B45A"></div>
      <div style="width: 14px; height: 14px; border-radius: 50%; background: #4FD1E0; box-shadow: 0 0 22px rgba(79,209,224,1)"></div>
    </div>
    <h1 style="margin: 0; font-family: Cinzel, Georgia, serif; font-weight: 600; font-size: 20px; letter-spacing: 0.26em; color: #D8B45A">INBOX</h1>
    <div style="display: flex; align-items: center; gap: 14px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #9A958A">
      <span>Mon 6 Oct</span>
      <span style="width: 4px; height: 4px; background: #D8B45A; transform: rotate(45deg)"></span>
      <span style="color: #4FD1E0">Synced</span>
    </div>
  </div>

  <div style="flex: 1; padding: 26px 28px 0 28px; display: flex; flex-direction: column; position: relative">
    <div style="position: absolute; top: 26px; bottom: 0; left: 39px; width: 1px; background: linear-gradient(180deg, #4FD1E0 0%, rgba(216,180,90,0.5) 40%, rgba(216,180,90,0.1) 100%); box-shadow: 0 0 8px rgba(79,209,224,0.4)"></div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 0 0 10px 0">
      <span style="width: 22px; height: 22px; border-radius: 50%; border: 1px solid #D8B45A; background: #0B0E14; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 8px; height: 8px; border-radius: 50%; background: #4FD1E0; box-shadow: 0 0 8px rgba(79,209,224,0.9)"></span></span>
      <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.14em; color: #D8B45A">TODAY</span>
    </div>
    <div style="display: flex; align-items: flex-start; gap: 14px; padding: 8px 0 14px 0">
      <button aria-label="Mark done" style="width: 44px; height: 44px; margin: -11px 0 0 -11px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #D8B45A; background: #0B0E14; display: block"></span></button>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 5px; margin-left: -8px">
        <div style="font-size: 16px; line-height: 1.4; font-weight: 500">Newsletter issue: why local-first beats cloud-first for personal tools</div>
        <div style="display: flex; gap: 8px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #4FD1E0">#writing</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #9A958A">2 min · phone</span></div>
      </div>
    </div>
    <div style="display: flex; align-items: flex-start; gap: 14px; padding: 8px 0 14px 0">
      <button aria-label="Mark done" style="width: 44px; height: 44px; margin: -11px 0 0 -11px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #D8B45A; background: #0B0E14; display: block"></span></button>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 5px; margin-left: -8px">
        <div style="font-size: 16px; line-height: 1.4; font-weight: 500">Ask the cousin about the Q4 data feed before Friday</div>
        <div style="display: flex; gap: 8px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #4FD1E0">#money</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #9A958A">laptop</span></div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 0 10px 0">
      <span style="width: 22px; height: 22px; border-radius: 50%; border: 1px solid #D8B45A; background: #0B0E14; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 8px; height: 8px; border-radius: 50%; border: 1px solid #D8B45A"></span></span>
      <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.14em; color: #D8B45A">EARLIER</span>
    </div>
    <div style="display: flex; align-items: flex-start; gap: 14px; padding: 8px 0 14px 0">
      <button aria-label="Mark done" style="width: 44px; height: 44px; margin: -11px 0 0 -11px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #D8B45A; background: #0B0E14; display: block"></span></button>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 5px; margin-left: -8px">
        <div style="font-size: 16px; line-height: 1.4; font-weight: 500">Re-read Plato's Critias for the ring-city metaphor</div>
        <div style="display: flex; gap: 8px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #4FD1E0">#learn</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #9A958A">yesterday</span></div>
      </div>
    </div>
    <div style="display: flex; align-items: flex-start; gap: 14px; padding: 8px 0 14px 0; opacity: 0.5">
      <button aria-label="Mark not done" style="width: 44px; height: 44px; margin: -11px 0 0 -11px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 22px; height: 22px; border-radius: 50%; background: #D8B45A; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#0B0E14" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5l2.5 2.5 4.5-5"/></svg></span></button>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 5px; margin-left: -8px">
        <div style="font-size: 16px; line-height: 1.4; font-weight: 500; text-decoration: line-through">Book the Athens flights</div>
        <div style="display: flex; gap: 8px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #4FD1E0">#life</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #9A958A">done</span></div>
      </div>
    </div>
  </div>

  <div style="padding: 12px 20px 28px 20px; display: flex; flex-direction: column; gap: 8px">
    <label for="cap-nr" style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #D8B45A; padding-left: 20px">Capture</label>
    <div style="display: flex; align-items: center; gap: 10px; background: #121826; border: 1px solid #D8B45A; border-radius: 28px; padding: 6px 6px 6px 20px; box-shadow: 0 0 0 1px rgba(79,209,224,0.3), 0 0 24px rgba(79,209,224,0.2), 0 14px 40px rgba(0,0,0,0.5)">
      <input id="cap-nr" type="text" placeholder="A thought, wherever you are…" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; color: #E6E1D6; height: 44px">
      <button aria-label="Save thought" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #D8B45A; background: #0B0E14; color: #D8B45A; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 10px; height: 10px; border-radius: 50%; background: #4FD1E0; box-shadow: 0 0 14px rgba(79,209,224,1)"></span></button>
    </div>
  </div>
</div>
</x-dc>
